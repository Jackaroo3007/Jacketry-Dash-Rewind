
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GD Stats Tracker</title>
<style>
:root {
  --bg:#090b16;
  --panel:#111528;
  --panel2:#171d34;
  --line:rgba(160,180,255,.13);
  --text:#f2f4ff;
  --muted:#929bb9;
  --accent:#8b6cff;
  --cyan:#4de4e8;
  --green:#63e6a5;
  --radius:18px;
}
* {box-sizing:border-box}
body {
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:var(--bg);
  font-family:Inter,system-ui,sans-serif;
}
button,input {font:inherit}
.shell {width:min(1120px,calc(100% - 36px));margin:auto;padding:38px 0 70px}
header {display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}
.brand {display:flex;align-items:center;gap:13px}
.logo {
  width:42px;height:42px;display:grid;place-items:center;
  border-radius:12px;background:#8b6cff;
  color:#090b16;font-size:23px;font-weight:1000;
}
.brand-title {font-weight:850}
.brand-sub {color:var(--muted);font-size:12px;margin-top:2px}
.live-tag {color:var(--green);border:1px solid #63e6a544;background:#63e6a510;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:750}
.eyebrow {color:var(--cyan);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800}
h1 {font-size:clamp(34px,6vw,56px);letter-spacing:-.055em;line-height:1.02;margin:12px 0}
.intro {color:var(--muted);max-width:620px;line-height:1.65}
.stats-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:30px 0 34px}
.stat,.level-card,.panel {
  background:#131a30;
  border:1px solid var(--line);border-radius:var(--radius);
}
.stat {padding:18px 19px}
.stat-label {color:var(--muted);font-size:12px;font-weight:650}
.stat-value {font-size:27px;font-weight:850;margin-top:7px}
.section-head {display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:16px}
h2 {font-size:21px;margin:0}
.section-note {color:var(--muted);font-size:12px;margin-top:5px}
.search {width:min(260px,45vw);background:#111528;border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--text);outline:none}
.search:focus {border-color:#8b6cff}
.level-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.level-card {padding:18px;cursor:pointer;color:inherit;width:100%;text-align:left;transition:.18s}
.level-card:hover {transform:translateY(-3px);border-color:#8b6cff88}
.card-top {display:flex;justify-content:space-between;align-items:center}
.difficulty {font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:850;color:var(--cyan);background:#4de4e815;padding:6px 8px;border-radius:6px}
.best {color:var(--green);font-size:12px;font-weight:800}
.level-name {font-size:19px;font-weight:800;margin:15px 0 5px}
.level-creator {color:var(--muted);font-size:12px}
.progress-row {display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:18px 0 8px}
.bar {height:12px;background:#080b17;border:1px solid rgba(160,180,255,.2);border-radius:999px;position:relative;overflow:hidden;isolation:isolate}
.bar-runs {position:absolute;inset:0;border-radius:inherit;overflow:hidden}
 .bar-run {position:absolute;top:0;bottom:0;min-width:0;border-radius:0;background:#ffb84d}
.bar-run-zero {background:#ffb84d}
.bar-run-progress {background:#8b6cff}

.bar-legend {display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px}
.card-bottom {display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:14px}
.empty {color:var(--muted);padding:35px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);grid-column:1/-1}
.hidden {display:none!important}
.back {border:1px solid var(--line);color:var(--text);background:#171d34;padding:10px 14px;border-radius:10px;cursor:pointer;margin-bottom:22px}
.detail-title-row {display:flex;justify-content:space-between;align-items:start;gap:20px}
.detail-title-row h1 {margin-top:8px}
.detail-best {font-size:30px;font-weight:900;color:var(--green)}
.detail-meta {color:var(--muted);font-size:13px}
.detail-stats {display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:25px 0}
.panel {padding:20px}
.panel h3 {margin:0 0 16px;font-size:15px}
.run-list {display:grid;gap:10px}
.run {display:grid;grid-template-columns:85px 1fr auto;align-items:center;gap:13px;background:#0c1020;border:1px solid var(--line);padding:13px;border-radius:12px}
.run-range {font-size:18px;font-weight:850;white-space:nowrap}
.run-amount {display:inline-block;margin-left:5px;color:#ff8bb0;font-size:13px;font-weight:900;vertical-align:2px}
.run-date {color:var(--muted);font-size:11px;margin-top:3px}
.run-note {color:#c4cbe2;font-size:12px}
.run-type {color:var(--cyan);font-size:10px;font-weight:800;text-transform:uppercase}
.no-runs {color:var(--muted);font-size:13px}
footer {color:#66708e;text-align:center;font-size:11px;margin-top:48px}
@media(max-width:760px) {
  .stats-grid {grid-template-columns:repeat(2,1fr)}
  .level-grid {grid-template-columns:repeat(2,1fr)}
  .detail-stats {grid-template-columns:1fr}
}
@media(max-width:520px) {
  .shell {width:calc(100% - 24px);padding-top:24px}
  .level-grid {grid-template-columns:1fr}
  .section-head {align-items:stretch;flex-direction:column}
  .search {width:100%}
  .detail-title-row {flex-direction:column}
  .run {grid-template-columns:65px 1fr}
  .run-type {grid-column:2}
}
</style>
</head>
<body>
<main class="shell">
<header>
  <div class="brand">
    <div class="logo">GD</div>
    <div>
      <div class="brand-title">DASHBOARD</div>
      <div class="brand-sub">PROGRESS TRACKER</div>
    </div>
  </div>
  <div class="live-tag">● PERSONAL TRACKER</div>
</header>

<section id="home">
  <div class="eyebrow">Geometry Dash · Progress archive</div>
  <h1>V1<br><span style="color:#a88cff">Huge changes are along the way, Be back soon!</span></h1>
</html>
